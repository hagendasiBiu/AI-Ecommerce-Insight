    - data:
        code: "\"\"\"Standalone Dify strategy validator. Output remains a hypothesis\
          \ awaiting human approval.\"\"\"\nimport json\nimport re\n\n\ndef validate_strategy(value,\
          \ bundle):\n    evidence, diagnosis = bundle['evidence'], bundle['diagnosis']\n\
          \    if diagnosis['evidence_id'] != evidence['evidence_id']:\n        raise\
          \ ValueError('input_evidence_mismatch')\n    if not isinstance(value, dict)\
          \ or set(value) != {'evidence_id', 'strategies'} or value['evidence_id']\
          \ != evidence['evidence_id']:\n        raise ValueError('strategy_fields_or_evidence_id_invalid')\n\
          \    if not isinstance(value['strategies'], list) or not 1 <= len(value['strategies'])\
          \ <= 5:\n        raise ValueError('strategies_array_invalid')\n    findings\
          \ = {f['finding_id']: f for f in diagnosis['findings']}\n    ids, finding_ids\
          \ = set(), set()\n    for strategy in value['strategies']:\n        required\
          \ = {'strategy_id', 'finding_id', 'fact_ids', 'action', 'owner_function',\
          \ 'target_metric',\n                    'validation_design', 'validation_days',\
          \ 'guardrail', 'target_direction', 'limitations', 'effect_status'}\n   \
          \     if not isinstance(strategy, dict) or set(strategy) != required:\n\
          \            raise ValueError('strategy_item_fields_invalid')\n        sid,\
          \ fid = strategy['strategy_id'], strategy['finding_id']\n        if not\
          \ isinstance(sid, str) or not re.fullmatch(r'S[1-9][0-9]?', sid) or sid\
          \ in ids:\n            raise ValueError('strategy_id_invalid')\n       \
          \ if fid not in findings or fid in finding_ids:\n            raise ValueError('finding_id_unknown_or_duplicate')\n\
          \        ids.add(sid)\n        finding_ids.add(fid)\n        refs = strategy['fact_ids']\n\
          \        if not isinstance(refs, list) or not refs or len(refs) != len(set(refs)):\n\
          \            raise ValueError('fact_ids_invalid')\n        if any(ref not\
          \ in findings[fid]['fact_ids'] or ref not in evidence['facts'] for ref in\
          \ refs):\n            raise ValueError('fact_reference_invalid')\n     \
          \   for key in ['action', 'owner_function', 'target_metric', 'validation_design',\
          \ 'guardrail']:\n            text = strategy[key]\n            if not isinstance(text,\
          \ str) or not text.strip() or len(text) > 700:\n                raise ValueError('strategy_prose_invalid')\n\
          \            if re.search(r'[0-9０-９%％]', text):\n                raise ValueError('unsupported_quantitative_prose')\n\
          \        if type(strategy['validation_days']) is not int or not 7 <= strategy['validation_days']\
          \ <= 90:\n            raise ValueError('planned_validation_days_invalid')\n\
          \        if strategy['target_direction'] not in {'decrease', 'increase',\
          \ 'clarify'} or strategy['effect_status'] != 'hypothesis_only':\n      \
          \      raise ValueError('effect_must_be_hypothesis')\n        if not isinstance(strategy['limitations'],\
          \ list) or not strategy['limitations']:\n            raise ValueError('limitations_required')\n\
          \        for text in strategy['limitations']:\n            if not isinstance(text,\
          \ str) or not text.strip() or len(text) > 500 or re.search(r'[0-9０-９%％]',\
          \ text):\n                raise ValueError('limitation_invalid')\n    result\
          \ = dict(value)\n    result.update(human_review_status='pending', source_review_status=evidence.get('human_review_status',\
          \ 'pending'),\n                  scope='exploratory_development_sample_only',\
          \ prompt_version='strategy-generation-v1')\n    return result\n\n\ndef main(llm_json:\
          \ str, strategy_json: str) -> dict:\n    try:\n        if not isinstance(llm_json,\
          \ str) or not llm_json.strip() or len(llm_json) > 40000:\n            raise\
          \ ValueError('model_output_empty_or_too_large')\n        if not isinstance(strategy_json,\
          \ str) or len(strategy_json) > 180000:\n            raise ValueError('strategy_input_invalid')\n\
          \        result = validate_strategy(json.loads(llm_json), json.loads(strategy_json))\n\
          \        envelope = {'status': 'validated', 'strategy_plan': result, 'error_code':\
          \ None}\n    except (ValueError, TypeError, KeyError) as error:\n      \
          \  code = str(error) if type(error) is ValueError and str(error).replace('_',\
          \ '').isalnum() else 'invalid_json_or_types'\n        envelope = {'status':\
          \ 'validation_failed', 'strategy_plan': None, 'error_code': code, 'needs_review':\
          \ True}\n    return {'result': json.dumps(envelope, ensure_ascii=False,\
          \ allow_nan=False)}\n"
        code_language: python3
        outputs:
          result:
            children: null
            type: string
        selected: false
        title: 核对策略引用与验证计划
