    - data:
        code: "\"\"\"Self-contained Dify Code-node contract; no external dependencies\
          \ or model simulation.\"\"\"\nimport json\nimport math\n\nPROMPT_VERSION\
          \ = 'clothing-review-v1'\nTAXONOMY = {\n    'product_quality': ['material_quality',\
          \ 'workmanship', 'damage', 'durability', 'color_fading', 'pilling'],\n \
          \   'product_description': ['image_mismatch', 'spec_mismatch', 'missing_information'],\n\
          \    'product_price': ['high_price', 'low_value', 'price_change'],\n   \
          \ 'size_spec': ['too_small', 'too_large', 'length_mismatch', 'size_inconsistency'],\n\
          \    'delivery': ['delay', 'packaging_damage', 'tracking_issue', 'wrong_or_missing_item'],\n\
          \    'after_sales': ['refund_difficulty', 'return_exchange', 'slow_response'],\n\
          \    'product_function': ['function_failure', 'performance_gap'],\n    'shopping_experience':\
          \ ['ordering_issue', 'communication_issue'],\n    'other': ['specific_other_issue'],\n\
          }\nALLOWED_LABELS = {f'{parent}.{leaf}' for parent, leaves in TAXONOMY.items()\
          \ for leaf in leaves}\nSENTIMENTS = {'positive', 'neutral', 'negative',\
          \ 'mixed', 'unknown'}\nSCOPES = {'in_scope', 'out_of_scope', 'uncertain'}\n\
          FIELDS = {'review_id', 'scope_status', 'sentiment', 'sentiment_evidence',\
          \ 'issues',\n          'user_need', 'issue_summary', 'confidence', 'needs_review'}\n\
          \n\ndef validate_input(review):\n    fields = {'review_id', 'review_text',\
          \ 'language', 'product_category'}\n    if not isinstance(review, dict) or\
          \ set(review) != fields:\n        raise ValueError('input_fields_invalid')\n\
          \    for key in fields:\n        if not isinstance(review[key], str):\n\
          \            raise ValueError('input_string_required')\n    if not review['review_id'].strip()\
          \ or len(review['review_id']) > 128:\n        raise ValueError('review_id_invalid')\n\
          \    if not review['review_text'].strip() or len(review['review_text'])\
          \ > 4000:\n        raise ValueError('review_text_empty_or_too_long')\n \
          \   if review['language'] not in {'zh', 'en', 'pt'} or review['product_category']\
          \ != 'clothing':\n        raise ValueError('language_or_category_invalid')\n\
          \    return review\n\n\ndef validate_output(value, review):\n    validate_input(review)\n\
          \    if not isinstance(value, dict) or set(value) != FIELDS:\n        raise\
          \ ValueError('output_fields_invalid')\n    if value['review_id'] != review['review_id']:\n\
          \        raise ValueError('review_id_mismatch')\n    if value['scope_status']\
          \ not in SCOPES or value['sentiment'] not in SENTIMENTS:\n        raise\
          \ ValueError('enum_invalid')\n    for key in ['user_need', 'issue_summary']:\n\
          \        if not isinstance(value[key], str) or len(value[key]) > 500:\n\
          \            raise ValueError('summary_string_invalid')\n    confidence\
          \ = value['confidence']\n    if type(confidence) not in {int, float} or\
          \ not math.isfinite(confidence) or not 0 <= confidence <= 1:\n        raise\
          \ ValueError('confidence_invalid')\n    if type(value['needs_review']) is\
          \ not bool:\n        raise ValueError('needs_review_boolean_required')\n\
          \    text = review['review_text']\n    evidence = value['sentiment_evidence']\n\
          \    if not isinstance(evidence, list) or len(evidence) > 5:\n        raise\
          \ ValueError('sentiment_evidence_invalid')\n    for quote in evidence:\n\
          \        if not isinstance(quote, str) or not quote.strip() or quote not\
          \ in text:\n            raise ValueError('sentiment_evidence_not_in_source')\n\
          \    if value['sentiment'] != 'unknown' and not evidence:\n        raise\
          \ ValueError('sentiment_evidence_required')\n    issues = value['issues']\n\
          \    if not isinstance(issues, list) or len(issues) > 10:\n        raise\
          \ ValueError('issues_array_invalid')\n    labels = []\n    for issue in\
          \ issues:\n        if not isinstance(issue, dict) or set(issue) != {'label',\
          \ 'evidence'}:\n            raise ValueError('issue_fields_invalid')\n \
          \       if issue['label'] not in ALLOWED_LABELS or issue['label'] in labels:\n\
          \            raise ValueError('issue_label_invalid_or_duplicate')\n    \
          \    quote = issue['evidence']\n        if not isinstance(quote, str) or\
          \ not quote.strip() or quote not in text:\n            raise ValueError('issue_evidence_not_in_source')\n\
          \        labels.append(issue['label'])\n    if value['sentiment'] == 'positive'\
          \ and issues:\n        raise ValueError('positive_cannot_have_negative_issue_labels')\n\
          \    result = dict(value)\n    # Confidence is a model self-report, never\
          \ an empirically calibrated probability.\n    result['needs_review'] = bool(value['needs_review']\
          \ or confidence < 0.8 or value['sentiment'] == 'unknown'\n             \
          \                     or value['scope_status'] != 'in_scope')\n    result['primary_category']\
          \ = sorted({label.split('.')[0] for label in labels})\n    result['secondary_category']\
          \ = labels\n    result['prompt_version'] = PROMPT_VERSION\n    result['human_review_status']\
          \ = 'pending'\n    return result\n\n\ndef main(llm_json: str, review_json:\
          \ str) -> dict:\n    \"\"\"Dify output variable: result (String). Failure\
          \ is not a genuine unknown classification.\"\"\"\n    review_id = ''\n \
          \   try:\n        review = json.loads(review_json)\n        validate_input(review)\n\
          \        review_id = review['review_id']\n        if not isinstance(llm_json,\
          \ str) or not llm_json.strip() or len(llm_json) > 20000:\n            raise\
          \ ValueError('llm_output_empty_or_too_large')\n        value = validate_output(json.loads(llm_json),\
          \ review)\n        envelope = {'status': 'validated', 'review_id': review_id,\
          \ 'analysis': value}\n    except (ValueError, TypeError, KeyError) as error:\n\
          \        # No original model output in error messages: it could contain\
          \ secrets or invented text.\n        code = str(error) if type(error) is\
          \ ValueError and str(error).replace('_', '').isalnum() else 'invalid_json_or_types'\n\
          \        envelope = {'status': 'validation_failed', 'review_id': review_id,\
          \ 'error_code': code,\n                    'needs_review': True, 'analysis':\
          \ None}\n    return {'result': json.dumps(envelope, ensure_ascii=False,\
          \ allow_nan=False)}\n"
        code_language: python3
        isInIteration: true
        isInLoop: false
        iteration_id: '1794030198432'
