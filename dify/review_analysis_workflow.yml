    - data:
        code: "\"\"\"Paste into the Dify batch input Code node; standalone standard-library\
          \ Python.\"\"\"\nimport json\n\n\ndef main(reviews_json: str) -> dict:\n\
          \    if not isinstance(reviews_json, str) or len(reviews_json) > 30000:\n\
          \        raise ValueError('Batch input must be a JSON string of at most\
          \ 30000 characters')\n    reviews = json.loads(reviews_json)\n    if not\
          \ isinstance(reviews, list) or not 1 <= len(reviews) <= 5:\n        raise\
          \ ValueError('Use 1 to 5 reviews per batch during the pilot')\n    ids =\
          \ set()\n    items = []\n    for review in reviews:\n        if not isinstance(review,\
          \ dict) or set(review) != {'review_id', 'review_text', 'language', 'product_category'}:\n\
          \            raise ValueError('Unexpected input fields; never send source\
          \ labels or private audit data')\n        if any(not isinstance(review[k],\
          \ str) for k in review):\n            raise ValueError('All input fields\
          \ must be strings')\n        if not review['review_id'].strip() or len(review['review_id'])\
          \ > 128 or review['review_id'] in ids:\n            raise ValueError('Review\
          \ IDs must be nonempty, unique and at most 128 characters')\n        if\
          \ not review['review_text'].strip() or len(review['review_text']) > 4000:\n\
          \            raise ValueError('Review text must contain 1 to 4000 characters')\n\
          \        if review['language'] not in {'zh', 'en', 'pt'} or review['product_category']\
          \ != 'clothing':\n            raise ValueError('Unsupported language or\
          \ category')\n        ids.add(review['review_id'])\n        items.append(json.dumps(review,\
          \ ensure_ascii=False))\n    return {'reviews': items, 'batch_size': len(items)}\n"
