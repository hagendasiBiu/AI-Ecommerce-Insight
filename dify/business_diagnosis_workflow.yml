    - data:
        code: "\"\"\"Self-contained Dify diagnosis Code node. Verify referenced facts;\
          \ no invented statistics.\"\"\"\nimport json\nimport re\n\n\ndef validate_diagnosis(value,\
          \ evidence):\n    if not isinstance(evidence, dict) or not isinstance(evidence.get('facts'),\
          \ dict) or not isinstance(evidence.get('issues'), list):\n        raise\
          \ ValueError('input_evidence_invalid')\n    if not isinstance(value, dict)\
          \ or set(value) != {'evidence_id', 'findings', 'limitations'}:\n       \
          \ raise ValueError('diagnosis_fields_invalid')\n    if value['evidence_id']\
          \ != evidence.get('evidence_id'):\n        raise ValueError('evidence_id_mismatch')\n\
          \    if not isinstance(value['findings'], list) or len(value['findings'])\
          \ > 5:\n        raise ValueError('findings_array_invalid')\n    def prose(text,\
          \ max_length=500):\n        if not isinstance(text, str) or not text.strip()\
          \ or len(text) > max_length:\n            raise ValueError('prose_string_invalid')\n\
          \        # All quantitative facts are renderer-owned registry values. No\
          \ prose figures.\n        if re.search(r'[0-9０-９%％]', text):\n         \
          \   raise ValueError('put_quantitative_facts_in_fact_ids_not_prose')\n \
          \   index = {i['issue_label']: i for i in evidence['issues']}\n    ids,\
          \ labels = set(), set()\n    for finding in value['findings']:\n       \
          \ required = {'finding_id', 'issue_label', 'fact_ids', 'evidence_review_ids',\
          \ 'possible_causes', 'next_validation'}\n        if not isinstance(finding,\
          \ dict) or set(finding) != required:\n            raise ValueError('finding_fields_invalid')\n\
          \        fid = finding['finding_id']\n        if not isinstance(fid, str)\
          \ or not re.fullmatch(r'D[1-9][0-9]?', fid) or fid in ids:\n           \
          \ raise ValueError('finding_id_invalid')\n        ids.add(fid)\n       \
          \ label = finding['issue_label']\n        if label not in index or label\
          \ in labels:\n            raise ValueError('issue_label_missing_or_duplicate')\n\
          \        labels.add(label)\n        issue = index[label]\n        fact_ids\
          \ = finding['fact_ids']\n        if not isinstance(fact_ids, list) or not\
          \ fact_ids or len(fact_ids) != len(set(fact_ids)):\n            raise ValueError('fact_ids_invalid')\n\
          \        if any(key not in issue['fact_ids'] or key not in evidence['facts']\
          \ for key in fact_ids):\n            raise ValueError('unrecognized_or_wrong_issue_fact_id')\n\
          \        refs = finding['evidence_review_ids']\n        allowed = {e['review_id']\
          \ for e in issue['evidence']}\n        if not isinstance(refs, list) or\
          \ not refs or len(refs) != len(set(refs)) or not set(refs).issubset(allowed):\n\
          \            raise ValueError('evidence_review_ids_invalid')\n        causes\
          \ = finding['possible_causes']\n        if not isinstance(causes, list)\
          \ or not 1 <= len(causes) <= 3:\n            raise ValueError('causes_array_invalid')\n\
          \        for cause in causes:\n            if not isinstance(cause, dict)\
          \ or set(cause) != {'hypothesis', 'status'} or cause['status'] != 'unverified':\n\
          \                raise ValueError('causes_must_be_unverified_hypotheses')\n\
          \            prose(cause['hypothesis'])\n        prose(finding['next_validation'])\n\
          \    if not isinstance(value['limitations'], list) or not value['limitations']:\n\
          \        raise ValueError('limitations_required')\n    for text in value['limitations']:\n\
          \        prose(text)\n    result = dict(value)\n    result['human_review_status']\
          \ = 'pending'\n    result['source_review_status'] = evidence.get('human_review_status',\
          \ 'pending')\n    result['scope'] = evidence.get('scope')\n    result['mandatory_limitations']\
          \ = evidence.get('limitations', [])\n    result['prompt_version'] = 'business-diagnosis-v1'\n\
          \    return result\n\n\ndef main(llm_json: str, metrics_json: str) -> dict:\n\
          \    try:\n        if not isinstance(llm_json, str) or not llm_json.strip()\
          \ or len(llm_json) > 30000:\n            raise ValueError('llm_output_empty_or_too_large')\n\
          \        if not isinstance(metrics_json, str) or len(metrics_json) > 150000:\n\
          \            raise ValueError('metrics_input_too_large')\n        evidence\
          \ = json.loads(metrics_json)\n        diagnosis = validate_diagnosis(json.loads(llm_json),\
          \ evidence)\n        envelope = {'status': 'validated', 'diagnosis': diagnosis,\
          \ 'error_code': None}\n    except (ValueError, TypeError, KeyError) as error:\n\
          \        code = str(error) if type(error) is ValueError and str(error).replace('_',\
          \ '').isalnum() else 'invalid_json_or_types'\n        envelope = {'status':\
          \ 'validation_failed', 'diagnosis': None, 'error_code': code, 'needs_review':\
          \ True}\n    return {'result': json.dumps(envelope, ensure_ascii=False,\
          \ allow_nan=False)}\n"
        code_language: python3
        outputs:
          result:
